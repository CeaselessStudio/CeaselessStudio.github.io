<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ceaseless Studio</title>
<style>
  :root { --bg:#0b0b0b; --fg:#f2f2f2; --muted:#8a8a8a; --accent:#992D22; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font-family:Georgia,'Times New Roman',serif; line-height:1.6; }
  main { max-width:720px; margin:0 auto; padding:0 16px; }
  header { padding:96px 0 48px; border-bottom:1px solid #222; }
  h1 { font-size:clamp(2.2rem,8vw,4rem); margin:0; letter-spacing:.04em; }
  h1 span { color:var(--accent); }
  .tag { color:var(--muted); margin-top:12px; }
  section { padding:40px 0; border-bottom:1px solid #222; }
  h2 { color:var(--accent); font-size:1.1rem; text-transform:uppercase; letter-spacing:.15em; margin:0 0 16px; }
  ul { padding-left:20px; margin:0; }
  li { margin-bottom:8px; }
  a { color:var(--fg); text-decoration-color:var(--accent); text-underline-offset:4px; }
  a:hover { color:var(--accent); }
  footer { padding:32px 0 64px; color:var(--muted); font-size:.9rem; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Ceaseless <span>Studio</span></h1>
    <p class="tag">Discord-боты, автоматизация и русская локализация визуальных новелл.</p>
  </header>
  <section>
    <h2>Что делаем</h2>
    <ul>
      <li>Discord-боты для сообществ</li>
      <li>Автоматизация рутины</li>
      <li>Русская локализация визуальных новелл</li>
    </ul>
  </section>
  <section>
    <h2>Связь</h2>
    <p><a href="https://github.com/CeaselessStudio">GitHub: CeaselessStudio</a></p>
  </section>
  <footer>Тестовая страница. Скоро здесь будет больше.</footer>
</main>
</body>
</html>
